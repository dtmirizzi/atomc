name: Release npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and pack but do not publish"
        type: boolean
        default: true

permissions:
  contents: read
  # Required for npm provenance (OIDC) when publishing for real.
  id-token: write

jobs:
  publish:
    name: publish @atomc/* to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Tag matches scripts/release/VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(cat scripts/release/VERSION)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v${tag} does not match scripts/release/VERSION=${version}"
            exit 1
          fi

      - name: Every package version matches VERSION
        run: python3 scripts/release/sync-versions.py --check

      - name: Changesets status (advisory)
        continue-on-error: true
        run: pnpm exec changeset status

      - name: Build
        run: pnpm exec turbo run build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          set -euo pipefail
          # Tag pushes never dry-run; manual dispatches default to dry_run=true.
          DRY="${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}"
          if [ "$DRY" = "true" ]; then
            echo "dry run: pnpm -r publish (no upload)"
            pnpm -r publish --access public --dry-run --no-git-checks
          else
            pnpm -r publish --access public --provenance --no-git-checks
          fi

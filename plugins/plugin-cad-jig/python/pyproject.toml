[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "atomc-plugin-cad-jig"
version = "0.0.1"
description = "atomc cad-jig plugin: parametric plate/case/pogo-jig models and mechanical gates"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
  "atomc-plugin-sdk>=0.0.1",
]

[project.optional-dependencies]
cad = [
  "build123d>=0.13.0",
]
test = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
]

[project.entry-points."atomc.plugins"]
cad-jig = "atomc_plugin_cad_jig:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/atomc_plugin_cad_jig"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "atomc-plugin.json"]

[tool.uv.sources]
atomc-plugin-sdk = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "atomc-plugin-renode"
version = "0.0.1"
description = "Renode emulation plugin: IR -> .repl/.resc scripts and honest boot/matrix gates"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
  "atomc-core-ir",
  "atomc-plugin-sdk",
]

[project.optional-dependencies]
test = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
]

[project.entry-points."atomc.plugins"]
renode = "atomc_plugin_renode:plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/atomc_plugin_renode"]

[tool.uv.sources]
atomc-core-ir = { workspace = true }
atomc-plugin-sdk = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

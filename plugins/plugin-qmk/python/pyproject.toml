[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "atomc-plugin-qmk"
version = "0.0.1"
description = "IR to QMK keyboard definition derivation and qmk compile gate for atomc"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
  "atomc-core-ir>=0.0.1",
  "atomc-plugin-sdk>=0.0.1",
  "pydantic>=2.14",
]

[project.optional-dependencies]
test = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
]

[project.entry-points."atomc.plugins"]
qmk = "atomc_plugin_qmk:plugin"

[tool.uv.sources]
atomc-core-ir = { workspace = true }
atomc-plugin-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atomc_plugin_qmk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

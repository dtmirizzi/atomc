[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "atomc-plugin-sourcing"
version = "0.0.1"
description = "atomc plugin: BOM sourcing adapters, offer normalization and caching"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
  "atomc-core-ir>=0.0.1",
  "atomc-plugin-sdk>=0.0.1",
  "httpx>=0.28.1",
  "pydantic>=2.14",
]

[project.optional-dependencies]
test = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
]

[project.entry-points."atomc.plugins"]
sourcing = "atomc_plugin_sourcing:plugin"

[tool.uv.sources]
atomc-core-ir = { workspace = true }
atomc-plugin-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atomc_plugin_sourcing"]

[tool.hatch.build.targets.wheel.force-include]
"../atomc-plugin.json" = "atomc_plugin_sourcing/atomc-plugin.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

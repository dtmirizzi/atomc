[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "atomc-plugin-atopile"
version = "0.1.0"
description = "atomc plugin: atopile compilation, PCB import and ERC gates"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
  "atomc-core-ir",
  "atomc-plugin-sdk",
  "pydantic>=2.14",
]

[project.optional-dependencies]
# kiutils is only needed to parse `.kicad_pcb` boards; the plugin reports a structured
# UNAVAILABLE result when it is missing rather than importing it at module scope.
pcb = ["kiutils>=1.4.8"]
test = ["pytest>=9.2", "kiutils>=1.4.8"]

[project.entry-points."atomc.plugins"]
atopile = "atomc_plugin_atopile:plugin"

[tool.uv.sources]
atomc-core-ir = { workspace = true }
atomc-plugin-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atomc_plugin_atopile"]

[tool.hatch.build.targets.wheel.force-include]
"../atomc-plugin.json" = "atomc_plugin_atopile/atomc-plugin.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

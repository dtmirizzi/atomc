[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "atomc-plugin-orders"
version = "0.0.1"
description = "atomc orders plugin: vendor cart files, draft-only order ledger and mock carrier tracking"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
  "atomc-core-ir",
  "atomc-plugin-sdk",
  "pydantic>=2.14",
]

[project.optional-dependencies]
test = [
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
]

[project.entry-points."atomc.plugins"]
orders = "atomc_plugin_orders:plugin"

[tool.uv.sources]
atomc-core-ir = { workspace = true }
atomc-plugin-sdk = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/atomc_plugin_orders"]

[tool.hatch.build.targets.wheel.force-include]
"../atomc-plugin.json" = "atomc_plugin_orders/atomc-plugin.json"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

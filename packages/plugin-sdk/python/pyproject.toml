[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[project]
name = "atomc-plugin-sdk"
version = "0.0.1"
description = "Python SDK for authoring atomc plugins: manifest parsing, host protocol, conformance"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.14",
  "jsonschema>=4.26",
]

[project.optional-dependencies]
test = [
  "pytest>=9.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atomc_plugin_sdk"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
